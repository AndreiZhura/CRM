<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>Вход в систему | Кондеи</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Вход для Олега</h2>
            <form id="loginForm" class="login-form">
                <div class="field-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="oleg@mail.ru">
                </div>
                <div class="field-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Войти в систему</button>
                <p id="errorMessage" style="color: red; display: none; margin-top: 10px;"></p>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
