version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crm_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oleg_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    container_name: crm_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: >
      sh -c "python backend/wait_for_db.py &&
         uvicorn backend.src.main:app --host 0.0.0.0 --port 8000"

  ml:
    build:
      context: ./backend
      dockerfile: ml_service/Dockerfile.ml
    container_name: crm_ml
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./backend/ml_service/models:/app/ml_service/models
      - ./backend/models:/app/models

volumes:
  postgres_data: