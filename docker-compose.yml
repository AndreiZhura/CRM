services:
  db:
    image: postgres:15-alpine
    container_name: crm_db
    platform: linux/amd64
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oleg_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build: .
    container_name: crm_backend
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - ./logs:/app/logs

  ml:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: crm_ml
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - default

volumes:
  postgres_data: