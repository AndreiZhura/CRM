<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карточка мастера | Олег-Холод</title>
    <link rel="stylesheet" href="/static/css/blocks/header.css">
    <link rel="stylesheet" href="/static/css/blocks/installer_profile.css">
</head>
<body>
    {% include "components/header.html" %}

    <main class="content" id="installer-page" data-id="{{ id }}">
        <div class="profile-container">
            <div class="profile-sidebar">
                <div class="avatar-big" id="avatar_letter">?</div>
                <h1 id="view_fio">...</h1>
                <p id="view_nickname"></p>
                <div class="rating-badge" id="view_rating">⭐ 10</div>
                
                <hr>
                
                <div class="info-group">
                    <label>Телефон:</label>
                    <span id="view_phone">...</span>
                </div>
                <div class="info-group">
                    <label>Спец:</label>
                    <span id="view_spec">...</span>
                </div>
                <div class="info-group">
                    <label>Базовая цена:</label>
                    <span id="view_price">0</span> ₽
                </div>
                <div id="view_debt_status" style="font-weight: bold; margin-top: 10px;"></div>

                <div class="profile-actions" style="margin-top: 20px;">
                    <button class="btn-danger" onclick="deleteInstaller()">Удалить мастера</button>
                </div>
            </div>

            <div class="profile-main">
                <h2>Заказы в работе</h2>
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Клиент</th>
                            <th>Адрес</th>
                            <th>Статус</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="masterOrdersTable">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/js/installer_detail.js"></script>
</body>
</html>
