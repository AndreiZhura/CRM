<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Добавить мастера | Олег-Холод</title>
    <link rel="stylesheet" href="/static/css/blocks/header.css" />
    <link rel="stylesheet" href="/static/css/blocks/installer_add.css" />
  </head>
  <body>
    {% include "components/header.html" %}

 <div class="form-container">
    <h1>Новое досье мастера</h1>
    <form id="addInstallerForm">
        <div class="form-group">
            <label>ФИО *</label>
            <input type="text" id="fio" required>
        </div>
        <div class="form-group">
            <label>Кликуха (Nickname)</label>
            <input type="text" id="nickname">
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="text" id="phone">
        </div>
        <div class="form-group">
            <label>Специализация:</label>
            <input type="checkbox" name="spec" value="Мойщик"> Мойщик
            <input type="checkbox" name="spec" value="Альпинист"> Альпинист
            <input type="checkbox" name="spec" value="Установщик"> Установщик
        </div>
        <div class="form-group">
            <label>Рейтинг (1-10)</label>
            <input type="number" id="rating" value="10" min="1" max="10">
        </div>
        <div class="form-group">
            <label>Должник?</label>
            <select id="is_debtor">
                <option value="false">Нет</option>
                <option value="true">Да</option>
            </select>
        </div>
        <div class="form-group">
            <label>Цена за монтаж</label>
            <input type="number" id="base_price" value="0">
        </div>
        <div class="form-group">
            <label>Статус в воронке</label>
            <select id="status">
                <option value="Новый">Новый</option>
                <option value="Проверен">Проверен</option>
                <option value="В работе">В работе</option>
            </select>
        </div>
        <div class="form-group">
            <label>Досье</label>
            <textarea id="dossier" rows="4"></textarea>
        </div>
        <button type="submit" class="btn-save">Сохранить</button>
    </form>
</div>
<script src="/static/js/installer_add.js"></script>

    <script src="/static/js/installer_add.js"></script>
  </body>
</html>
