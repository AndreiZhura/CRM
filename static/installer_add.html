{% import "components/phone.html" as inputs %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавить мастера | Олег-Холод</title>
    <link rel="stylesheet" href="/static/css/blocks/header.css" />
    <link rel="stylesheet" href="/static/css/blocks/installer_add.css" />
    <link rel="stylesheet" href="/static/css/blocks/phone.css" />
  </head>
  <body>
    {% include "components/header.html" %}

    <div class="form-container">
      <h1>Добавить мастера</h1>
      <form id="addInstallerForm">
        <div class="form-group">
          <label for="fio">ФИО *</label>
          <input type="text" id="fio" required placeholder="Иванов Иван Иванович"/>
        </div>
        
        <div class="form-group">
          <label for="nickname">Кликуха (Nickname)</label>
          <input type="text" id="nickname" placeholder="Напр: Мороз"/>
        </div>

        {{ inputs.phone_input('phone', '') }}

        <div class="form-group">
          <label for="specialization">Специализация *</label>
          <input type="text" id="specialization" placeholder="Установщик, Альпинист" required />
          <small class="helper-text">Введите через запятую</small>
        </div>

        <div class="form-group">
          <label for="rating">Рейтинг (1-10)</label>
          <input type="number" id="rating" value="10" min="1" max="10" />
        </div>

        <div class="debt-banner">
          <h3 class="debt-title">💰 Финансовый статус</h3>
          <div class="debt-row">
            <div class="checkbox-group">
              <input type="checkbox" id="is_debtor" />
              <label for="is_debtor">В долгу</label>
            </div>
            <div class="field-group flex-grow">
              <label for="debt_amount">Сумма долга (₽)</label>
              <input type="number" id="debt_amount" value="0" step="0.01" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="base_price">Цена за монтаж (базовая)</label>
          <input type="number" id="base_price" value="0" />
        </div>

        <div class="form-group">
          <label for="status">Статус в воронке</label>
          <select id="status">
            <option value="Новый">Новый</option>
            <option value="Проверен">Проверен</option>
            <option value="В работе">В работе</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dossier">Досье / Заметки</label>
          <textarea class="textarea-group" id="dossier" rows="4" placeholder="Особенности мастера..."></textarea>
        </div>

        <button type="submit" id="saveOrderBtn" class="btn-save">💾 Сохранить досье</button>
      </form>
    </div>

    <script src="/static/js/phone.js"></script>
    <script src="/static/js/installer_add.js"></script>
    <script src="/static/js/common.js"></script>
  </body>
</html>
