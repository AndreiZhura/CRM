<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заказ #{{ order_id }} | Олег-Холод</title>

    <link rel="stylesheet" href="/static/css/blocks/header.css" />
    <link rel="stylesheet" href="/static/css/blocks/footer.css" />
    <link rel="stylesheet" href="/static/css/blocks/order-form.css" />
  </head>
  <body class="page">
    {% include "components/header.html" %}

    <main class="content">
      <form id="editOrderForm" class="crm-form">
        <div class="crm-form__header-info">
          <a href="/journal" class="crm-form__back-link"
            >← Вернуться в журнал</a
          >
          <h2 class="crm-form__main-title">
            Редактирование заказа №<span id="order-number-display"
              >{{ order_id }}</span
            >
          </h2>
        </div>

        <fieldset class="crm-form__section">
          <legend class="crm-form__legend">👤 Данные клиента</legend>
          <div class="crm-form__grid">
            <div class="crm-form__field">
              <label class="crm-form__label">ФИО клиента</label>
              <input
                type="text"
                id="fio"
                class="crm-form__input"
                placeholder="Введите ФИО"
              />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Телефон</label>
              <input
                type="tel"
                id="phone"
                class="crm-form__input"
                placeholder="+7 (___) ___ - __ - __"
              />
            </div>
            <div class="crm-form__field crm-form__field--full">
              <label class="crm-form__label">Адрес установки</label>
              <input
                type="text"
                id="address"
                class="crm-form__input"
                placeholder="Город, улица, дом, квартира"
              />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Назначенный монтажник</label>
              <select id="installer_id" class="crm-form__input">
                <option value="">-- Выберите монтажника --</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset class="crm-form__section">
          <legend class="crm-form__legend">📅 Планирование и Логистика</legend>
          <div class="crm-form__grid">
            <div class="crm-form__field">
              <label class="crm-form__label">Дата обращения (системная)</label>
              <input
                type="text"
                id="created_at"
                class="crm-form__input crm-form__input--readonly"
                readonly
              />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Дата обслуживания</label>
              <input type="date" id="service_date" class="crm-form__input" />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Дата монтажа (план)</label>
              <input
                type="date"
                id="appointment_date"
                class="crm-form__input"
              />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Привоз кондиционера</label>
              <input type="date" id="delivery_date" class="crm-form__input" />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Склад отгрузки</label>
              <input
                type="text"
                id="warehouse"
                class="crm-form__input"
                placeholder="Название склада"
              />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Продавец / Менеджер</label>
              <input type="text" id="seller_name" class="crm-form__input" />
            </div>
          </div>
        </fieldset>

        <fieldset class="crm-form__section crm-form__section--finance">
          <legend class="crm-form__legend">💰 Финансовая часть</legend>
          <div class="crm-form__grid">
            <div class="crm-form__field">
              <label class="crm-form__label">Цена закупки (₽)</label>
              <input type="number" id="buy_price" class="crm-form__input" />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Продажа клиенту (₽)</label>
              <input type="number" id="sell_price_ac" class="crm-form__input" />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Оплата монтажнику (₽)</label>
              <input type="number" id="price_install" class="crm-form__input" />
            </div>
            <div class="crm-form__field">
              <label class="crm-form__label">Ваша комиссия (₽)</label>
              <input type="number" id="my_commission" class="crm-form__input" />
            </div>
            <div class="crm-form__field crm-form__field--full">
              <label class="crm-form__checkbox-label">
                <input type="checkbox" id="is_money_returned" />
                <span class="crm-form__checkbox-text"
                  >Монтажник вернул деньги в кассу</span
                >
              </label>
            </div>
          </div>
        </fieldset>

        <fieldset class="crm-form__section">
          <legend class="crm-form__legend">⚙️ Статус и Исполнение</legend>
          <div class="crm-form__grid">
            <div class="crm-form__field">
              <label class="crm-form__label">Текущий статус</label>
              <select id="status" class="crm-form__input">
                <option value="Новая заявка">Новая заявка</option>
                <option value="Ждет установщика">Ждет установщика</option>
                <option value="В работе">В работе</option>
                <option value="Завершено">Завершено</option>
                <option value="Отказ">Отказ</option>
              </select>
            </div>

            <div class="crm-form__field crm-form__field--full">
              <label class="crm-form__label"
                >Обещания (скидки, бонусы, доп. работы)</label
              >
              <textarea
                id="promises"
                class="crm-form__input"
                rows="3"
                placeholder="Например: скидка 5% на второй кондей"
              ></textarea>
            </div>
            <div class="crm-form__field crm-form__field--full">
              <label class="crm-form__label"
                >Внутренние комментарии / Мнение монтажника</label
              >
              <textarea
                id="comments"
                class="crm-form__input"
                rows="3"
              ></textarea>
            </div>
          </div>
        </fieldset>

        <div class="crm-form__actions">
          <button
            type="submit"
            class="crm-form__button crm-form__button--submit"
          >
            💾 Сохранить все изменения
          </button>
          <button
            type="button"
            id="deleteOrder"
            class="crm-form__button crm-form__button--delete"
          >
            🗑 Удалить заказ
          </button>
        </div>
      </form>
    </main>

    {% include "components/footer.html" %}

    <script src="/static/js/order_detail.js"></script>
    <script src="/static/js/order_detail.js"></script>
  </body>
</html>
