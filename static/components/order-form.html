<form id="orderForm" class="crm-form">
    <fieldset class="crm-form__section">
        <legend class="crm-form__legend">👤 Карточка клиента</legend>
        <div class="crm-form__grid">
            <div class="crm-form__field">
                <label class="crm-form__label">ФИО клиента</label>
                <input type="text" id="fio" required class="crm-form__input" placeholder="Иванов Иван">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Номер телефона</label>
                <div class="phone-input-container">
                    <input type="tel" id="phone" name="phone" class="crm-form__input phone-mask" placeholder="+7 (___) ___-__-__" required>
                </div>
            </div>
            <div class="crm-form__field crm-form__field--full">
                <label class="crm-form__label">Адрес (Проживания)</label>
                <input type="text" id="address" required class="crm-form__input" placeholder="ул. Пушкина, д. Колотушкина">
            </div>
            <div class="crm-form__field crm-form__field--full">
                <label class="crm-form__label">Модель кондиционера</label>
                <input type="text" id="model" class="crm-form__input" placeholder="Haier Coral AS25H">
            </div>
        </div>
    </fieldset>

    <fieldset class="crm-form__section">
        <legend class="crm-form__legend">📅 Планирование и Логистика</legend>
        <div class="crm-form__grid">
            <div class="crm-form__field">
                <label class="crm-form__label">Дата обслуживания</label>
                <input type="date" id="service_date" class="crm-form__input">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Дата доставки (склад)</label>
                <input type="date" id="delivery_date" class="crm-form__input">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Установка (договор)</label>
                <input type="date" id="appointment_date" class="crm-form__input">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Склад</label>
                <select id="warehouse" class="crm-form__input">
                    <option value="Основной">Основной</option>
                    <option value="Транзит">Транзит</option>
                </select>
            </div>
        </div>
    </fieldset>

    <fieldset class="crm-form__section crm-form__section--finance">
        <legend class="crm-form__legend">💰 Финансы</legend>
        <div class="crm-form__grid">
            <div class="crm-form__field">
                <label class="crm-form__label">Закупка (₽)</label>
                <input type="number" id="buy_price" class="crm-form__input" placeholder="0">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Продажа (₽)</label>
                <input type="number" id="sell_price_ac" class="crm-form__input" placeholder="0">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Монтажнику (₽)</label>
                <input type="number" id="price_install" class="crm-form__input" placeholder="0">
            </div>
            <div class="crm-form__field">
                <label class="crm-form__label">Моя комиссия (₽)</label>
                <input type="number" id="my_commission" class="crm-form__input" placeholder="0">
            </div>
        </div>
    </fieldset>

    <fieldset class="crm-form__section">
        <legend class="crm-form__legend">📝 Статус и Заметки</legend>
        <div class="crm-form__grid">
            <div class="crm-form__field crm-form__field--full">
                <label class="crm-form__label">Текущий статус</label>
                <select id="status" class="crm-form__input">
                    <option value="Новая заявка">Новая заявка</option>
                    <option value="Ждет установщика">Ждет установщика</option>
                    <option value="Завершено">Завершено</option>
                </select>
            </div>
            <div class="crm-form__field crm-form__field--full">
                <label class="crm-form__label">Обещания клиенту</label>
                <textarea id="promises" class="crm-form__input" placeholder="Уточнить время за час..."></textarea>
            </div>
            <div class="crm-form__field crm-form__field--full">
                <label class="crm-form__label">Мнение монтажника</label>
                <textarea id="installer_opinion" class="crm-form__input" placeholder="Сложный доступ к блоку..."></textarea>
            </div>
        </div>
    </fieldset>

    <div class="crm-form__actions">
        <button type="submit" class="crm-form__button crm-form__button--submit">
            <span>🚀 Создать карточку заказа</span>
        </button>
    </div>
</form>
