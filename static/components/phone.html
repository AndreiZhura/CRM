{% macro phone_input(id, value='') %}
<div class="field-group">
    <label>Телефон / Связь</label>
    <div class="phone-input-container">
        <input 
            type="tel" 
            id="{{ id }}" 
            name="{{ id }}"
            value="{{ value if value else '8' }}"
            class="phone-mask"
            placeholder="8 (999) 000-00-00"
            maxlength="18"
        >
        <div class="phone-actions">
            <a href="#" id="call_{{ id }}" class="action-btn call-btn hidden">📞</a>
            <a href="#" id="tg_{{ id }}" target="_blank" class="action-btn tg-btn hidden">✈️</a>
        </div>
    </div>
</div>
{% endmacro %}
