<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Монтажники | Олег-Холод</title>
    <link rel="stylesheet" href="/static/css/blocks/header.css" />
    <link rel="stylesheet" href="/static/css/blocks/footer.css" />
    <link rel="stylesheet" href="/static/css/blocks/installers.css" />
  </head>
  <body>
    {% include "components/header.html" %}

    <main class="content">
      <div class="page-header">
        <h1>Список мастеров</h1>
        <a href="/installers/add" class="btn-primary">
          <span>+</span> Добавить мастера
        </a>
      </div>

      <div class="search-filters">
        <div class="search-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="searchName"
              placeholder="Поиск по ФИО..."
              class="search-input"
            />
            <span class="search-icon">🔍</span>
          </div>
        </div>

        <div class="search-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="searchSpec"
              placeholder="Поиск по специализации..."
              class="search-input"
            />
            <span class="search-icon">🔍</span>
          </div>
        </div>

        <div class="search-group checkbox-group">
          <input type="checkbox" id="filterDebt" class="custom-checkbox" />
          <label for="filterDebt">Только должники</label>
        </div>
      </div>

      <div class="table-responsive">
        <table class="orders-table">
          <thead>
            <tr>
              <th>ФИО / Ник</th>
              <th>Телефон</th>
              <th>Специализация</th>
              <th>Рейтинг</th>
              <th>Статус</th>
            </tr>
          </thead>
          <tbody id="installersTableBody"></tbody>
        </table>
      </div>
    </main>

    
    <script src="/static/js/common.js"></script>
    <script src="/static/js/installers_page.js"></script>
  </body>
</html>
